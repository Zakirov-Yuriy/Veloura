# Конфигурация генерации локализаций (flutter gen-l10n).
# Запускается автоматически при `flutter pub get`, когда в pubspec.yaml
# в секции flutter стоит `generate: true`.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# AppLocalizations.of(context) будет non-nullable — меньше "!" в экранах.
nullable-getter: false
